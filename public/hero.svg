<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Ilustrasi halaman konten: editor teks dengan pratinjau konten dan tanda terbit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fafb" />
      <stop offset="1" stop-color="#e5e7eb" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity="0.14" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Latar -->
  <rect width="1200" height="760" rx="28" fill="url(#bg)" />
  <circle cx="1040" cy="170" r="150" fill="#111827" opacity="0.06" />
  <circle cx="110" cy="660" r="96" fill="#f59e0b" opacity="0.16" />
  <circle cx="1090" cy="640" r="56" fill="#111827" opacity="0.07" />

  <!-- Kartu utama: jendela editor -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="120" width="720" height="520" rx="22" fill="#ffffff" />
    <path d="M150 142a22 22 0 0 1 22-22h676a22 22 0 0 1 22 22v40H150z" fill="#1f2937" />
    <circle cx="184" cy="152" r="6.5" fill="#4b5563" />
    <circle cx="208" cy="152" r="6.5" fill="#6b7280" />
    <circle cx="232" cy="152" r="6.5" fill="#f59e0b" />
    <rect x="560" y="145" width="280" height="14" rx="7" fill="#374151" />
  </g>

  <!-- Isi editor -->
  <rect x="196" y="228" width="330" height="24" rx="12" fill="#111827" />
  <rect x="196" y="266" width="150" height="12" rx="6" fill="#9ca3af" />

  <rect x="196" y="316" width="564" height="12" rx="6" fill="#d1d5db" />
  <rect x="196" y="344" width="564" height="12" rx="6" fill="#d1d5db" />
  <rect x="196" y="372" width="420" height="12" rx="6" fill="#d1d5db" />

  <!-- Blok gambar di dalam konten -->
  <rect x="196" y="412" width="292" height="150" rx="14" fill="#e5e7eb" />
  <circle cx="252" cy="462" r="18" fill="#9ca3af" />
  <path d="M206 552l64-70 48 52 34-30 36 48z" fill="#9ca3af" />

  <!-- Teks di samping blok gambar -->
  <rect x="516" y="424" width="244" height="12" rx="6" fill="#d1d5db" />
  <rect x="516" y="452" width="244" height="12" rx="6" fill="#d1d5db" />
  <rect x="516" y="480" width="196" height="12" rx="6" fill="#d1d5db" />
  <rect x="516" y="516" width="140" height="40" rx="10" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2" />

  <!-- Tombol terbit -->
  <rect x="196" y="588" width="152" height="46" rx="12" fill="#111827" />
  <rect x="224" y="608" width="96" height="8" rx="4" fill="#ffffff" opacity="0.9" />

  <!-- Kartu melayang: cuplikan data / API -->
  <g filter="url(#softShadow)">
    <rect x="742" y="512" width="326" height="178" rx="18" fill="#ffffff" />
  </g>
  <rect x="774" y="546" width="118" height="14" rx="7" fill="#111827" />
  <rect x="774" y="582" width="262" height="11" rx="5.5" fill="#d1d5db" />
  <rect x="774" y="610" width="230" height="11" rx="5.5" fill="#d1d5db" />
  <rect x="774" y="638" width="176" height="11" rx="5.5" fill="#e5e7eb" />
  <rect x="774" y="666" width="70" height="11" rx="5.5" fill="#f59e0b" />

  <!-- Lencana terbit -->
  <circle cx="1064" cy="452" r="42" fill="url(#amber)" />
  <path d="M1046 452l12 12 24-26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Kilau / aksen -->
  <path d="M120 200l9 24 24 9-24 9-9 24-9-24-24-9 24-9z" fill="#f59e0b" opacity="0.75" />
  <path d="M990 300l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#111827" opacity="0.35" />
  <circle cx="132" cy="440" r="10" fill="#111827" opacity="0.25" />
</svg>