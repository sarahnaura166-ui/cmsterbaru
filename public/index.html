<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Publish - Node.js CMS</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- AREA PUBLISH: hanya menampilkan konten, tanpa form input -->
    <div class="container mx-auto p-6 max-w-3xl">
        <header class="mb-8 flex items-start justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Node.js CMS & Firestore</h1>
                <p class="text-gray-600">Halaman Publish &mdash; konten yang dikelola dari area admin</p>
            </div>
            <a href="/admin" class="shrink-0 bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition text-sm">
                Area Admin
            </a>
        </header>

        <div id="postsList" class="space-y-6">
            <div class="bg-white p-6 rounded-lg shadow-md text-gray-500">Memuat data...</div>
        </div>
    </div>

    <script>
        // Helper untuk mencegah XSS dasar
        function escapeHtml(text) {
            var amp = '&' + 'amp;';
            var lt = '&' + 'lt;';
            var gt = '&' + 'gt;';
            var quot = '&' + 'quot;';
            return String(text == null ? '' : text)
                .replace(/&/g, amp)
                .replace(/</g, lt)
                .replace(/>/g, gt)
                .replace(/"/g, quot);
        }

        function formatDate(value) {
            const date = new Date(value);
            return isNaN(date.getTime()) ? '-' : date.toLocaleString();
        }

        // Fungsi untuk mengambil dan merender postingan (read-only)
        async function fetchPosts() {
            const container = document.getElementById('postsList');

            try {
                const response = await fetch('/api/posts');
                const result = await response.json().catch(() => null);

                if (!response.ok) {
                    throw new Error((result && result.error) || ('Permintaan gagal (' + response.status + ').'));
                }

                const posts = Array.isArray(result) ? result : [];

                if (posts.length === 0) {
                    container.innerHTML = '<div class="bg-white p-6 rounded-lg shadow-md text-gray-500">Belum ada postingan.</div>';
                    return;
                }

                container.innerHTML = posts.map(function (post) {
                    return '<article class="bg-white p-6 rounded-lg shadow-md">' +
                        '<h2 class="text-xl font-bold text-gray-800">' + escapeHtml(post.title) + '</h2>' +
                        '<p class="text-gray-600 mt-2 whitespace-pre-line">' + escapeHtml(post.content) + '</p>' +
                        '<span class="text-xs text-gray-400 mt-4 block">Dibuat: ' + formatDate(post.createdAt) + '</span>' +
                        '</article>';
                }).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                container.innerHTML = '<div class="bg-white p-6 rounded-lg shadow-md text-red-600">Gagal memuat data: ' +
                    escapeHtml(error.message) + '</div>';
            }
        }

        // Load data saat halaman dibuka
        fetchPosts();
    </script>
</body>
</html>
